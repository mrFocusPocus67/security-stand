name: Secret Scanning (Gitleaks + TruffleHog)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TARGET_REPO: WebGoat/WebGoat

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout целевого проекта
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          path: target
          fetch-depth: 0

      - name: Установка Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Запуск Gitleaks
        run: |
          gitleaks detect --source ./target \
            --report-format json \
            --report-path gitleaks-results.json \
            --no-banner || true

      - name: Установка TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Запуск TruffleHog
        run: |
          # --no-verification: не проверяем найденные ключи на живых сервисах (быстрее и безопаснее)
          trufflehog git file://$PWD/target \
            --json --no-update --no-verification \
            > trufflehog-results.json || true

      - name: Сводка по результатам (Секреты)
        run: |
          echo "Gitleaks:   $(jq 'length' gitleaks-results.json) находок"
          echo "TruffleHog: $(wc -l < trufflehog-results.json) находок"
        continue-on-error: true

      - name: Загрузка артефактов
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scanning-reports
          path: |
            gitleaks-results.json
            trufflehog-results.json
          if-no-files-found: warn
