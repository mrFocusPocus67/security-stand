name: Security checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Папка для отчётов
        run: mkdir -p reports

      #Bandit -SAST
      - name: Bandit
        run: |
          pip install bandit
          echo "Bandit: $(pip show bandit | grep Version | cut -d' ' -f2)" >> reports/versions.txt
          bandit -r app -f json -o reports/bandit.json || true

      #OSV-Scanner - SCA 
      - name: OSV-Scanner
        run: |
          curl -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x osv-scanner
          echo "OSV-Scanner: $(./osv-scanner --version | head -n 1)" >> reports/versions.txt
          ./osv-scanner scan source -r app --format json > reports/osv.json || true

      # Gitleaks
      - name: Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          echo "Gitleaks: 8.18.4" >> reports/versions.txt
          ./gitleaks detect --source . --report-format json --report-path reports/gitleaks.json --no-banner || true

      - name: Сводная таблица
        run: |
          python scripts/make_report.py > reports/summary.md
          cat reports/summary.md >> $GITHUB_STEP_SUMMARY
          
      - name: Сохраняем отчёты
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
