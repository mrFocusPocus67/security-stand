name: Security Scan (SBOM + Secrets)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TARGET_REPO: OWASP/NodeGoat

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout целевого проекта
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          path: target
          fetch-depth: 0

      - name: Установка Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Запуск Syft
        run: |
          syft scan dir:./target -o cyclonedx-json=syft-results.cdx.json || true

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установка cdxgen
        run: npm install -g @cyclonedx/cdxgen

      - name: Запуск cdxgen
        run: |
          cdxgen -r -o cdxgen-results.json ./target || true

      - name: Установка Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Запуск Gitleaks
        run: |
          gitleaks detect --source ./target \
            --report-format json \
            --report-path gitleaks-results.json \
            --no-banner || true
            
      - name: Установка TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Запуск TruffleHog
        run: |
          # --no-verification: не проверяем найденные ключи на живых сервисах (быстрее и безопаснее)
          trufflehog git file://$PWD/target \
            --json --no-update --no-verification \
            > trufflehog-results.json || true

      - name: Сводка по результатам
        run: |
          echo "Syft:       $(jq '.components | length' syft-results.cdx.json) компонентов"
          echo "cdxgen:     $(jq '.components | length' cdxgen-results.json) компонентов"
          echo "Gitleaks:   $(jq 'length' gitleaks-results.json) находок"
          echo "TruffleHog: $(wc -l < trufflehog-results.json) находок"
        continue-on-error: true

      - name: Загрузка артефактов
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            syft-results.cdx.json
            cdxgen-results.json
            gitleaks-results.json
            trufflehog-results.json
          if-no-files-found: warn
